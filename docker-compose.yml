name: reachinbox

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reachinbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reachinbox}
      POSTGRES_DB: ${POSTGRES_DB:-reachinbox}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reachinbox} -d ${POSTGRES_DB:-reachinbox}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: reachinbox-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000

      # Prisma connects to Postgres by the Docker service name "postgres",
      # never localhost - the two containers only share the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-reachinbox}:${POSTGRES_PASSWORD:-reachinbox}@postgres:5432/${POSTGRES_DB:-reachinbox}?schema=public

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      ELASTICSEARCH_NODE: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-reachinbox_emails}

      MAX_EMAILS_PER_HOUR: ${MAX_EMAILS_PER_HOUR:-200}
      MIN_DELAY_MS: ${MIN_DELAY_MS:-2000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}

      ETHEREAL_SMTP_HOST: ${ETHEREAL_SMTP_HOST:-smtp.ethereal.email}
      ETHEREAL_SMTP_PORT: ${ETHEREAL_SMTP_PORT:-587}

      # OAuth/Slack secrets are never hardcoded - they come from the host's
      # own .env (copy docker/.env.example -> .env) and default to empty,
      # which the app treats as "feature disabled" rather than crashing.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/auth/google/callback}

      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI:-http://localhost:4000/api/slack/callback}

      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Runs the compiled BullMQ email worker. Reuses the exact backend image
  # (no separate Dockerfile/build) rather than rebuilding - `docker compose
  # up --build` builds "backend" once and this service just runs it with a
  # different command. No port is published since the worker serves nothing.
  worker:
    image: reachinbox-backend:latest
    depends_on:
      backend:
        condition: service_healthy
    command: ["node", "dist/workers/emailWorker.js"]
    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://${POSTGRES_USER:-reachinbox}:${POSTGRES_PASSWORD:-reachinbox}@postgres:5432/${POSTGRES_DB:-reachinbox}?schema=public

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      ELASTICSEARCH_NODE: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-reachinbox_emails}

      MAX_EMAILS_PER_HOUR: ${MAX_EMAILS_PER_HOUR:-200}
      MIN_DELAY_MS: ${MIN_DELAY_MS:-2000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}

      ETHEREAL_SMTP_HOST: ${ETHEREAL_SMTP_HOST:-smtp.ethereal.email}
      ETHEREAL_SMTP_PORT: ${ETHEREAL_SMTP_PORT:-587}

      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle at build time - must be the URL the
        # browser on the HOST machine can reach (the published backend port),
        # not the in-network "backend" service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  es_data:
